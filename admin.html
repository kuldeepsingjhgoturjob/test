<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin – Got UR Job</title>
<style>
[hidden]{display:none!important}
:root{--navy:#0d2145;--or:#ff6a13;--bg:#f3f6fc;--card:#fff;--tx:#14213d;--mu:#5a6682;--ln:#dde3f0}
@media(prefers-color-scheme:dark){:root{--bg:#081329;--card:#102244;--tx:#eaf0fb;--mu:#a6b3cc;--ln:#25375c}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}header b{font-size:18px;flex:1}
button,.b{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;background:var(--or);color:#fff;cursor:pointer}button.g{background:transparent;color:var(--tx);border:1.5px solid var(--ln)}header button{background:rgba(255,255,255,.15)}button.r{background:#c62828}button.s{padding:6px 12px;font-size:14px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:14px;font-weight:600}label.c{display:inline-flex;gap:6px;align-items:center;font-weight:500;margin-right:14px}label.c input{width:auto}
.box{max-width:380px;margin:12vh auto;background:var(--card);padding:28px;border-radius:18px;display:grid;gap:12px;border:1px solid var(--ln)}h1,h2,h3{margin:0}
nav{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap}nav button{background:var(--card);color:var(--tx);border:1.5px solid var(--ln)}nav button.on{background:var(--or);color:#fff;border-color:var(--or)}
main{max-width:1000px;margin:0 auto;padding:0 16px 60px}.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu);font-size:14px}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:99px;padding:2px 10px;font-size:13px;margin:2px 4px 2px 0}.cnt{background:var(--or);color:#fff;border-radius:99px;padding:2px 12px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left}.tw{overflow-x:auto}#note{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;display:none;z-index:9;max-width:90%}#note.bad{background:#c62828}
</style></head><body>
<div id="lg" class="box"><h1>Got UR Job admin</h1><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button id="go">Log in</button></div>
<div id="app" hidden><header><b>Got UR Job admin</b><span id="who"></span><button id="out">Log out</button></header><nav id="tabs"></nav><main id="main"></main></div><div id="note" role="status"></div>
<script>
const $=s=>document.querySelector(s);let T=sessionStorage.getItem('t'),ME=JSON.parse(sessionStorage.getItem('me')||'null'),JL=[],EDIT=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const can=k=>ME&&ME.perms&&ME.perms[k],dt=t=>new Date(t).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
const PL={add:'Add jobs',editOwn:'Edit own jobs',editAll:'Edit all jobs',delete:'Delete jobs',viewApps:'See applicants and resumes'};
function note(m,bad){const n=$('#note');n.textContent=m;n.className=bad?'bad':'';n.style.display='block';clearTimeout(note.t);note.t=setTimeout(()=>n.style.display='none',3500)}
async function api(path,o={}){const h={authorization:'Bearer '+T};if(o.json)h['content-type']='application/json';const r=await fetch('/api/'+path,{method:o.method||'GET',headers:h,body:o.json?JSON.stringify(o.json):undefined});
if(r.status===401&&T){out();throw new Error('Please log in again')}if(!r.ok){let m='Something went wrong';try{m=(await r.json()).error||m}catch(e){}throw new Error(m)}return (r.headers.get('content-type')||'').includes('json')?r.json():r}
async function run(f){try{await f()}catch(e){note(e.message,1)}}
function out(){sessionStorage.clear();T=ME=null;$('#app').hidden=true;$('#lg').hidden=false}
async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#p').value})});const d=await r.json().catch(()=>({}));if(!r.ok)return note(d.error||'Login failed',1);T=d.token;ME={name:d.name,role:d.role,perms:d.perms};sessionStorage.setItem('t',T);sessionStorage.setItem('me',JSON.stringify(ME));start()}
$('#go').onclick=()=>run(login);$('#p').onkeydown=e=>{if(e.key==='Enter')run(login)};$('#out').onclick=out;
function start(){$('#lg').hidden=true;$('#app').hidden=false;$('#who').textContent=ME.name+(ME.role==='admin'?' (admin)':'');const t=[['jobs','Jobs']];if(ME.role==='admin')t.push(['premium','Premium members'],['users','Users']);
$('#tabs').innerHTML=t.map(x=>`<button data-t="${x[0]}">${x[1]}</button>`).join('');$('#tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b)view(b.dataset.t)};view('jobs')}
function view(t){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));run({jobs:jobsV,premium:premV,users:usersV}[t])}
const F=(id,l,v='',ph='')=>`<div><label for="${id}">${l}</label><input id="${id}" value="${esc(v)}" placeholder="${esc(ph)}"></div>`;
async function jobsV(){const d=await api('admin/jobs');JL=d.jobs;const j=JL.find(x=>x.id===EDIT)||{},ok=EDIT?(can('editAll')||(can('editOwn')&&j.createdBy===ME.username)):can('add');
let h='';if(ok||!EDIT&&can('add'))h=`<div class="card"><h3>${EDIT?'Edit job':'Add a new job'}</h3><div class="grid">${F('f_title','Job title *',j.title)}${F('f_company','Company hiring for *',j.company)}${F('f_city','City *',j.city)}${F('f_exp','Experience',j.exp,'e.g. 1 to 3 years')}${F('f_salary','Salary range',j.salary,'e.g. 15,000 to 22,000 per month')}${F('f_age','Age limit',j.age,'e.g. 21 to 35')}${F('f_education','Education',j.education,'e.g. Graduate')}${F('f_phone','Call number (shown only as a Call button)',j.phone,'+91…')}</div>
<div class="grid"><div><label for="f_address">Office address</label><textarea id="f_address" rows="2">${esc(j.address)}</textarea></div></div>
<div class="row"><b>We provide:</b><label class="c"><input type="checkbox" id="f_pf" ${j.pf?'checked':''}>PF</label><label class="c"><input type="checkbox" id="f_esi" ${j.esi?'checked':''}>ESI</label><label class="c"><input type="checkbox" id="f_insurance" ${j.insurance?'checked':''}>Insurance</label><label class="c"><input type="checkbox" id="f_active" ${EDIT&&j.active===false?'':'checked'}>Show on website</label></div>
<div class="row" style="margin-top:12px"><button id="sv">${EDIT?'Save changes':'Post job'}</button>${EDIT?'<button class="g" id="cx">Cancel</button>':''}</div></div>`;
h+=`<h3 style="margin:8px 0 10px">All jobs (${JL.length})</h3>`+(JL.length?JL.map(x=>{const mine=can('editAll')||(can('editOwn')&&x.createdBy===ME.username);return `<div class="card"><div class="row"><b style="flex:1">${esc(x.title)}</b>${x.active?'':'<span class="pill">Hidden</span>'}${x.count!==null?`<span class="cnt">${x.count} applied</span>`:''}</div><div class="mu">${esc(x.company)} · ${esc(x.city)} · posted by ${esc(x.createdByName||x.createdBy)} on ${dt(x.ts)}${x.updatedBy?` · last changed by ${esc(x.updatedBy)}`:''}</div><div class="row" style="margin-top:10px">${can('viewApps')?`<button class="s g" data-a="${x.id}">View applicants</button>`:''}${mine?`<button class="s g" data-e="${x.id}">Edit</button>`:''}${can('delete')?`<button class="s r" data-d="${x.id}">Delete</button>`:''}</div><div id="ap_${x.id}"></div></div>`}).join(''):'<p class="mu">No jobs yet.</p>');
$('#main').innerHTML=h;
const sv=$('#sv');if(sv)sv.onclick=()=>run(async()=>{const b={};['title','company','city','exp','salary','age','education','phone','address'].forEach(k=>b[k]=$('#f_'+k).value);['pf','esi','insurance','active'].forEach(k=>b[k]=$('#f_'+k).checked);await api(EDIT?'admin/jobs/'+EDIT:'admin/jobs',{method:EDIT?'PUT':'POST',json:b});note(EDIT?'Saved':'Job posted');EDIT=null;jobsV()});
const cx=$('#cx');if(cx)cx.onclick=()=>{EDIT=null;run(jobsV)};
$('#main').onclick=e=>{const t=e.target;if(t.dataset.e){EDIT=t.dataset.e;run(jobsV);scrollTo(0,0)}if(t.dataset.d&&confirm('Delete this job?'))run(async()=>{await api('admin/jobs/'+t.dataset.d,{method:'DELETE'});note('Deleted');jobsV()});if(t.dataset.a)run(()=>apps(t.dataset.a));if(t.dataset.r)run(()=>dl(t.dataset.r,t.dataset.n))}}
async function apps(id){const d=await api('admin/apps/'+id),el=$('#ap_'+id);el.innerHTML=d.apps.length?`<div class="tw"><table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Applied</th><th>Resume</th></tr>${d.apps.map(a=>`<tr><td>${esc(a.name)}</td><td><a href="tel:${esc(a.phone)}">${esc(a.phone)}</a></td><td>${esc(a.email)}</td><td>${dt(a.ts)}</td><td><button class="s" data-r="${a.id}" data-n="${esc(a.file)}">Download</button></td></tr>`).join('')}</table></div>`:'<p class="mu">No applications yet.</p>'}
async function dl(id,n){const r=await api('admin/resume/'+id),u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download=n||'resume';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function premV(){const d=await api('admin/premium'),ST=['pending','active','placed','refunded','rejected','unpaid'];
const card=x=>{const dl=x.activatedTs?x.activatedTs+45*864e5:0,late=dl&&dl<Date.now()&&!x.interviewSent&&x.status==='active';return `<div class="card"><div class="row"><b style="flex:1">${esc(x.name)}</b><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></div><div class="mu">${esc(x.email)} · joined ${dt(x.ts)} · ${x.paid?'<span class="pill">Paid via Razorpay ✓</span> payment ID: '+esc(x.paymentId):'payment ref: '+(esc(x.txn)||'none')}</div><p>${esc(x.requirement)}</p><div class="row"><select data-s="${x.id}" style="width:auto">${ST.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select><label class="c"><input type="checkbox" data-i="${x.id}" ${x.interviewSent?'checked':''}>Interview sent</label>${x.hasShot?`<button class="s g" data-p="${x.id}">Payment screenshot</button>`:''}${x.hasResume?`<button class="s g" data-r="${x.id}">Resume</button>`:''}${x.consultantCall?'<span class="pill" style="background:#ff6a13;color:#fff;border-color:#ff6a13">Wants consultant call</span>':''}</div>${dl?`<p class="${late?'':'mu'}" style="${late?'color:#c62828;font-weight:700':''}">${late?'Refund due: ':'Refund deadline: '}${dt(dl)}</p>`:''}</div>`};
const paid=d.list.filter(x=>x.status!=='unpaid'),unp=d.list.filter(x=>x.status==='unpaid');
$('#main').innerHTML=`<h3 style="margin:8px 0 6px">Premium members (${paid.length})</h3><p class="mu">Razorpay payments become “active” automatically. For manual UPI payments, set “active” after you check the payment. Refund is due if no interview is sent within 1.5 months of activation. Refunds are issued from your Razorpay dashboard; then set “refunded” here.</p>`+(paid.length?paid.map(card).join(''):'<p class="mu">No premium members yet.</p>')+(unp.length?`<details style="margin-top:14px"><summary class="mu" style="cursor:pointer">Started checkout but did not pay (${unp.length})</summary>${unp.map(card).join('')}</details>`:'');
$('#main').onchange=e=>{const t=e.target;if(t.dataset.s)run(async()=>{await api('admin/premium/'+t.dataset.s,{method:'PUT',json:{status:t.value}});note('Updated');premV()});if(t.dataset.i)run(async()=>{await api('admin/premium/'+t.dataset.i,{method:'PUT',json:{interviewSent:t.checked}});note('Updated');premV()})};
$('#main').onclick=e=>{const t=e.target;if(t.dataset.r)run(async()=>{const r=await api('admin/resume/'+t.dataset.r);window.open(URL.createObjectURL(await r.blob()))});if(t.dataset.p)run(async()=>{const r=await api('admin/shot/'+t.dataset.p);window.open(URL.createObjectURL(await r.blob()))})}}
const PC=(p={})=>Object.keys(PL).map(k=>`<label class="c"><input type="checkbox" data-k="${k}" ${p[k]?'checked':''}>${PL[k]}</label>`).join('');
const gp=el=>Object.fromEntries([...el.querySelectorAll('[data-k]')].map(i=>[i.dataset.k,i.checked]));
async function usersV(){const d=await api('admin/users');
$('#main').innerHTML=`<div class="card" id="nu"><h3>Create a sub-user</h3><div class="grid">${F('n_name','Full name')}${F('n_user','Username (letters and numbers)')}<div><label for="n_pw">Password (8+ characters)</label><input id="n_pw" type="text" autocomplete="off"></div></div><div>${PC({add:1,editOwn:1})}</div><div class="row" style="margin-top:12px"><button id="cu">Create user</button></div></div><h3 style="margin:8px 0 10px">Sub-users (${d.users.length})</h3>`+(d.users.length?d.users.map(u=>`<div class="card" data-u="${esc(u.username)}"><div class="row"><b style="flex:1">${esc(u.name)} <span class="mu">@${esc(u.username)}</span></b><label class="c"><input type="checkbox" data-act ${u.active?'checked':''}>Active</label></div><div>${PC(u.perms)}</div><div class="row" style="margin-top:10px"><button class="s" data-sv>Save access</button><button class="s g" data-pw>New password</button><button class="s r" data-rm>Delete</button></div></div>`).join(''):'<p class="mu">No sub-users yet.</p>');
$('#cu').onclick=()=>run(async()=>{await api('admin/users',{method:'POST',json:{name:$('#n_name').value,username:$('#n_user').value,password:$('#n_pw').value,perms:gp($('#nu'))}});note('User created');usersV()});
$('#main').onclick=e=>{const t=e.target,c=t.closest('[data-u]');if(!c)return;const u=c.dataset.u;
if('sv' in t.dataset)run(async()=>{await api('admin/users/'+u,{method:'PUT',json:{perms:gp(c),active:c.querySelector('[data-act]').checked}});note('Saved')});
if('pw' in t.dataset){const p=prompt('New password for '+u+' (8+ characters)');if(p)run(async()=>{await api('admin/users/'+u,{method:'PUT',json:{password:p}});note('Password changed')})}
if('rm' in t.dataset&&confirm('Delete '+u+'?'))run(async()=>{await api('admin/users/'+u,{method:'DELETE'});note('Deleted');usersV()})}}
if(T&&ME)start();
</script></body></html>
